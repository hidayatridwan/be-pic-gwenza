services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: npm run dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # worker-upload:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.dev
  #   working_dir: /app
  #   command: npm run worker-upload
  #   env_file:
  #     - .env
  #   volumes:
  #     - .:/app
